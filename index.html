<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>IronLog — Gym Tracker</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191b23;--panel2:#222530;--line:#303340;--text:#f4f5f7;--muted:#a7abba;--accent:#c5f467;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#171a11;font-weight:750}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#492729;color:#ffdada}button:disabled{opacity:.45}
.app{max-width:760px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin:5px 0 22px}.brand{font-size:24px;font-weight:900;letter-spacing:-.8px}.brand span{color:var(--accent)}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.title{font-size:28px;letter-spacing:-.8px;margin:5px 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#14151bf2;border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(18px)}.tabs button{flex:1;max-width:180px;background:transparent;color:var(--muted);padding:10px 4px;font-size:12px}.tabs button.active{color:var(--accent);background:#272d20}.tabs span{display:block;font-size:18px;margin-bottom:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.metric{font-size:26px;font-weight:850;margin:7px 0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.pill{font-size:12px;color:var(--accent);background:#2b3420;border-radius:100px;padding:6px 9px;white-space:nowrap}.routine{width:100%;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:16px;margin:6px 0}.routine strong{display:block;font-size:17px;margin-bottom:5px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}.sectionhead h2{font-size:18px;margin:0}.exercise{padding:14px 0;border-top:1px solid var(--line)}.sethead,.setrow{display:grid;grid-template-columns:32px 1fr 1fr 42px;gap:7px;align-items:center}.sethead{font-size:11px;color:var(--muted);padding:8px 0}.setrow{margin:6px 0}.setnum{color:var(--muted);text-align:center}.setrow input{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:10px 6px;text-align:center}.check{width:38px;height:38px;padding:0;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}.check.done{background:var(--accent);color:#15180f}.field{width:100%;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);margin:6px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none!important}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.historyitem{padding:12px 0;border-top:1px solid var(--line)}.barbg{height:8px;background:var(--panel2);border-radius:10px;overflow:hidden;margin:9px 0}.bar{height:100%;background:var(--accent);border-radius:10px}.toast{position:fixed;left:16px;right:16px;bottom:88px;background:#e7f8c9;color:#1a2110;border-radius:12px;padding:12px 16px;font-weight:700;z-index:10;text-align:center}.timer{font-size:42px;font-weight:850;letter-spacing:-1px;text-align:center;margin:14px}.note{background:#252c1d;border:1px solid #455333;color:#d9f6ad;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">IRON<span>LOG</span></div><div class="eyebrow">Your personal training log</div></div><div class="pill" id="saveStatus">Saved on this device</div></header>
  <main id="screen"></main>
</div>
<nav class="tabs">
<button data-tab="home" class="active"><span>⌂</span>Home</button>
<button data-tab="workouts"><span>▤</span>Workouts</button>
<button data-tab="history"><span>◷</span>History</button>
<button data-tab="progress"><span>↗</span>Progress</button>
<button data-tab="settings"><span>⚙</span>Settings</button>
</nav>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='ironlog-data-v1';
const defaultRoutines=[
 {id:'push',name:'Push',subtitle:'Chest · Shoulders · Triceps',exercises:['Barbell Bench Press','Incline Dumbbell Press','Shoulder Press','Lateral Raise','Triceps Pushdown','Overhead Triceps Extension']},
 {id:'pull',name:'Pull',subtitle:'Back · Rear delts · Biceps',exercises:['Lat Pulldown','Seated Cable Row','Chest-Supported Row','Reverse Fly','Dumbbell Curl','Hammer Curl']},
 {id:'legs',name:'Legs',subtitle:'Quads · Hamstrings · Calves',exercises:['Leg Press','Romanian Deadlift','Leg Curl','Leg Extension','Calf Raise']},
 {id:'chestback',name:'Chest + Back',subtitle:'Upper body',exercises:['Barbell Bench Press','Incline Dumbbell Press','Lat Pulldown','Seated Cable Row','Cable Fly','Straight-Arm Pulldown']}
];
let data=loadData(), activeWorkout=null, timerInterval=null, timerSeconds=90;
function loadData(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.routines)&&Array.isArray(d.history))return d}catch(e){}return {routines:defaultRoutines.map(x=>({...x,exercises:[...x.exercises]})),history:[],units:'kg',rest:90};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saveStatus').textContent='Saved on this device'}catch(e){document.getElementById('saveStatus').textContent='Save issue';}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1900)}
function go(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(activeWorkout&&tab!=='session'){} render(tab)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(activeWorkout&&b.dataset.tab!=='session'&&!confirm('Leave this workout? Your current sets are kept only until you finish. Leave anyway?'))return;activeWorkout=null;go(b.dataset.tab)});
function totalSessions(){return data.history.length}
function fmtDate(d){return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function render(tab='home'){
 const s=document.getElementById('screen');
 if(activeWorkout){renderSession(s);return}
 if(tab==='home'){
 const last=data.history[0];
 s.innerHTML=`<div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1 class="title">Ready to get stronger?</h1><p class="muted">Every rep counts. Log it, then beat it.</p>
 <div class="grid"><div class="card"><div class="muted small">WORKOUTS LOGGED</div><div class="metric">${totalSessions()}</div><div class="small muted">Total sessions</div></div><div class="card"><div class="muted small">EXERCISES TRACKED</div><div class="metric">${new Set(data.history.flatMap(w=>w.exercises.map(e=>e.name))).size}</div><div class="small muted">Unique exercises</div></div></div>
 <div class="sectionhead"><h2>Start a workout</h2><button class="secondary" onclick="go('workouts')">All routines</button></div>
 ${data.routines.slice(0,4).map(r=>`<button class="routine" onclick="startWorkout('${r.id}')"><div class="row between"><strong>${esc(r.name)}</strong><span class="pill">${r.exercises.length} exercises</span></div><span class="muted small">${esc(r.subtitle||'Custom routine')}</span></button>`).join('')}
 <div class="sectionhead"><h2>Last session</h2></div>${last?`<div class="card"><div class="row between"><strong>${esc(last.name)}</strong><span class="muted small">${fmtDate(last.date)}</span></div><p class="muted small">${last.exercises.length} exercises · ${last.exercises.reduce((n,e)=>n+e.sets.length,0)} sets</p><button class="secondary" onclick="go('history')">View history</button></div>`:`<div class="card empty">Your workout history will show up here after your first session.</div>`}
 <div class="note">Your logs are stored locally in this browser on this iPhone. Use Settings to export a backup from time to time.</div>`;
 }else if(tab==='workouts'){
 s.innerHTML=`<h1 class="title">Workouts</h1><p class="muted">Choose a routine or create your own.</p>${data.routines.map(r=>`<div class="card"><div class="row between"><div class="grow"><h2 style="margin:0 0 5px">${esc(r.name)}</h2><div class="muted small">${esc(r.subtitle||'Custom routine')}</div></div><span class="pill">${r.exercises.length} exercises</span></div><p class="small muted">${r.exercises.map(esc).join(' · ')}</p><div class="actions"><button onclick="startWorkout('${r.id}')">Start workout</button><button class="secondary" onclick="editRoutine('${r.id}')">Edit</button></div></div>`).join('')}<button class="secondary" style="width:100%;margin-top:8px" onclick="newRoutine()">＋ Create routine</button>`;
 }else if(tab==='history'){
 s.innerHTML=`<h1 class="title">History</h1><p class="muted">Every completed session, all in one place.</p>${data.history.length?data.history.map(w=>`<div class="historyitem"><div class="row between"><strong>${esc(w.name)}</strong><span class="muted small">${fmtDate(w.date)}</span></div><p class="muted small">${w.exercises.length} exercises · ${w.exercises.reduce((n,e)=>n+e.sets.length,0)} sets · ${Math.round(w.exercises.reduce((n,e)=>n+e.sets.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0),0))} ${data.units} volume</p><button class="secondary" onclick="viewSession('${w.id}')">View details</button></div>`).join(''):`<div class="card empty">No workouts yet. Start a routine and finish your first session.</div>`}<div class="actions" style="margin-top:20px"><button class="secondary" onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div>`;
 }else if(tab==='progress'){
 const map={};data.history.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(set=>{let wt=+set.weight||0;if(wt>0){if(!map[e.name]||wt>map[e.name].weight)map[e.name]={weight:wt,date:w.date,reps:+set.reps||0}}})));
 const prs=Object.entries(map).sort((a,b)=>b[1].weight-a[1].weight);
 s.innerHTML=`<h1 class="title">Progress</h1><p class="muted">Your best logged weight for each exercise.</p><div class="grid"><div class="card"><div class="muted small">SESSIONS</div><div class="metric">${data.history.length}</div></div><div class="card"><div class="muted small">SETS LOGGED</div><div class="metric">${data.history.reduce((n,w)=>n+w.exercises.reduce((a,e)=>a+e.sets.length,0),0)}</div></div></div>${prs.length?prs.map(([name,p])=>`<div class="card"><div class="row between"><strong>${esc(name)}</strong><span class="pill">Best logged</span></div><div class="metric">${p.weight} ${data.units} <span class="muted small">× ${p.reps||'—'} reps</span></div><div class="muted small">${fmtDate(p.date)}</div></div>`).join(''):`<div class="card empty">Log weights in your workouts to start seeing your records here.</div>`}<p class="muted small">Records are based on the heaviest weight you've logged for a set, not estimated 1RM.</p>`;
 }else if(tab==='settings'){
 s.innerHTML=`<h1 class="title">Settings</h1><p class="muted">Make IronLog work for you.</p><div class="card"><label class="small muted">Weight unit</label><select class="field" id="units"><option value="kg" ${data.units==='kg'?'selected':''}>Kilograms (kg)</option><option value="lb" ${data.units==='lb'?'selected':''}>Pounds (lb)</option></select><label class="small muted">Default rest timer (seconds)</label><select class="field" id="rest"><option value="60">60 seconds</option><option value="90">90 seconds</option><option value="120">120 seconds</option><option value="180">180 seconds</option><option value="240">240 seconds</option></select><button onclick="saveSettings()">Save settings</button></div><div class="card"><h2 style="margin-top:0">Backup your data</h2><p class="muted small">Your workout data stays in this browser on this device. Export a JSON backup regularly, especially before clearing Safari website data or changing phones.</p><div class="actions"><button onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restore backup</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div></div><div class="card"><h2 style="margin-top:0">Install on iPhone</h2><p class="muted small">Host this folder on an HTTPS static host, open its URL in Safari, tap Share, then Add to Home Screen. See README.txt for complete steps.</p></div><div class="card"><button class="danger" onclick="resetData()">Reset all data</button><p class="muted small">This permanently clears your routines and workout history in this browser. Export a backup first.</p></div>`;
 document.getElementById('rest').value=String(data.rest||90);
 }
}
function startWorkout(id){const r=data.routines.find(x=>x.id===id);if(!r)return;activeWorkout={id:crypto.randomUUID(),routineId:id,name:r.name,startedAt:new Date().toISOString(),exercises:r.exercises.map(name=>({name,sets:[{weight:'',reps:'',done:false},{weight:'',reps:'',done:false},{weight:'',reps:'',done:false}]}))};render()}
function renderSession(s){
 s.innerHTML=`<div class="row between"><button class="secondary" onclick="if(confirm('Discard this unfinished workout?')){activeWorkout=null;go('workouts')}">← Exit</button><span class="pill">Workout in progress</span></div><h1 class="title" style="margin-top:20px">${esc(activeWorkout.name)}</h1><p class="muted small">Enter weight and reps for each set. Tap ✓ when complete.</p>
 ${activeWorkout.exercises.map((e,ei)=>`<div class="exercise"><div class="row between"><strong>${esc(e.name)}</strong><button class="secondary" style="padding:8px 10px" onclick="removeExercise(${ei})">Remove</button></div><div class="sethead"><span>SET</span><span>WEIGHT (${data.units})</span><span>REPS</span><span>DONE</span></div>${e.sets.map((set,si)=>`<div class="setrow"><span class="setnum">${si+1}</span><input aria-label="weight" inputmode="decimal" placeholder="0" value="${esc(set.weight)}" onchange="updateSet(${ei},${si},'weight',this.value)"><input aria-label="reps" inputmode="numeric" placeholder="0" value="${esc(set.reps)}" onchange="updateSet(${ei},${si},'reps',this.value)"><button class="check ${set.done?'done':''}" onclick="toggleSet(${ei},${si})">${set.done?'✓':'○'}</button></div>`).join('')}<button class="secondary" style="padding:9px 12px;margin-top:5px" onclick="addSet(${ei})">＋ Add set</button></div>`).join('')}
 <button class="secondary" style="width:100%;margin:12px 0" onclick="addExerciseToWorkout()">＋ Add exercise</button>
 <div class="card"><h2 style="margin-top:0">Rest timer</h2><div class="timer" id="timerDisplay">${formatTime(timerSeconds)}</div><div class="actions"><button onclick="startTimer()">Start ${data.rest}s rest</button><button class="secondary" onclick="stopTimer()">Reset</button></div></div>
 <button style="width:100%;padding:16px;margin-top:10px" onclick="finishWorkout()">Finish & save workout</button>`;
}
function updateSet(ei,si,key,val){activeWorkout.exercises[ei].sets[si][key]=val}
function toggleSet(ei,si){const x=activeWorkout.exercises[ei].sets[si];x.done=!x.done;if(x.done){timerSeconds=data.rest;startTimer()}render()}
function addSet(ei){activeWorkout.exercises[ei].sets.push({weight:'',reps:'',done:false});render()}
function removeExercise(ei){if(confirm('Remove this exercise from this workout?')){activeWorkout.exercises.splice(ei,1);render()}}
function addExerciseToWorkout(){const name=prompt('Exercise name');if(name&&name.trim()){activeWorkout.exercises.push({name:name.trim(),sets:[{weight:'',reps:'',done:false},{weight:'',reps:'',done:false},{weight:'',reps:'',done:false}]});render()}}
function finishWorkout(){if(!activeWorkout)return;const exercises=activeWorkout.exercises.map(e=>({name:e.name,sets:e.sets.filter(s=>String(s.weight).trim()!==''||String(s.reps).trim()!=='').map(s=>({weight:s.weight,reps:s.reps,done:s.done}))})).filter(e=>e.sets.length);if(!exercises.length&&!confirm('No sets have values. Save this workout anyway?'))return;data.history.unshift({id:activeWorkout.id,name:activeWorkout.name,date:new Date().toISOString(),exercises});activeWorkout=null;stopTimer();save();go('history');toast('Workout saved 💪')}
function formatTime(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
function startTimer(){stopTimer();timerSeconds=data.rest||90;const display=document.getElementById('timerDisplay');if(display)display.textContent=formatTime(timerSeconds);timerInterval=setInterval(()=>{timerSeconds--;const d=document.getElementById('timerDisplay');if(d)d.textContent=formatTime(Math.max(0,timerSeconds));if(timerSeconds<=0){stopTimer();toast('Rest finished — next set!');if(navigator.vibrate)navigator.vibrate([150,80,150])}},1000)}
function stopTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null;const d=document.getElementById('timerDisplay');if(d)d.textContent=formatTime(timerSeconds)}
function newRoutine(){const name=prompt('Routine name (e.g. Upper body)');if(!name||!name.trim())return;const ex=prompt('Exercises separated by commas');const exercises=(ex||'').split(',').map(x=>x.trim()).filter(Boolean);data.routines.push({id:crypto.randomUUID(),name:name.trim(),subtitle:'Custom routine',exercises});save();go('workouts')}
function editRoutine(id){const r=data.routines.find(x=>x.id===id);if(!r)return;const name=prompt('Routine name',r.name);if(name===null)return;const ex=prompt('Exercises separated by commas',r.exercises.join(', '));if(ex===null)return;r.name=name.trim()||r.name;r.exercises=ex.split(',').map(x=>x.trim()).filter(Boolean);save();go('workouts');toast('Routine updated')}
function saveSettings(){data.units=document.getElementById('units').value;data.rest=+document.getElementById('rest').value;save();go('settings');toast('Settings saved')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ironlog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.routines)||!Array.isArray(d.history))throw Error();if(confirm('Replace current data with this backup?')){data=d;save();go('home');toast('Backup restored')}}catch(err){alert('That file does not look like a valid IronLog backup.')}e.target.value=''};reader.readAsText(f)}
function resetData(){if(confirm('Delete all IronLog routines and history from this browser? Export a backup first if needed.')){localStorage.removeItem(KEY);data=loadData();save();go('home');toast('Data reset')}}
function viewSession(id){const w=data.history.find(x=>x.id===id);if(!w)return;alert(`${w.name} — ${fmtDate(w.date)}\n\n`+w.exercises.map(e=>e.name+'\n'+e.sets.map((s,i)=>`Set ${i+1}: ${s.weight||'—'} ${data.units} × ${s.reps||'—'} reps`).join('\n')).join('\n\n'))}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render('home');
</script>
</body></html>
